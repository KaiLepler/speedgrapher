name: validation

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Check dependency metadata
        run: go mod tidy -diff
      - name: Test
        run: go test -timeout 90s ./...
      - name: Race detection
        run: go test -race -timeout 90s ./...
      - name: Vet
        run: go vet ./...
      - name: Installer syntax and mocked integrity tests
        run: |
          bash -n install.sh
          python3 -m unittest discover -s tests -p 'test_*.py' -v
  hugo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.145.0'
      - name: Real Hugo integration tests (must not skip)
        env:
          HUGO_INTEGRATION: '1'
        run: go test -v -count=1 -timeout 90s ./internal/tools/seo
